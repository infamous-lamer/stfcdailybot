name: Set up Python and Poetry via asdf
description: >
  Installs curl and the CPython build toolchain, marks the workspace as a
  safe git directory, and installs the .tool-versions-pinned Python and
  Poetry via asdf. Assumes the repo has already been checked out and that
  git is already installed (actions/checkout itself needs git, so callers
  must apt-get install git and run actions/checkout before this action).
runs:
  using: composite
  steps:
    - name: Install curl and Python build dependencies
      shell: bash
      run: |
        apt-get update && apt-get install -y --no-install-recommends \
          curl ca-certificates \
          build-essential libssl-dev zlib1g-dev libbz2-dev \
          libreadline-dev libsqlite3-dev libncursesw5-dev \
          xz-utils tk-dev libxml2-dev libxmlsec1-dev libffi-dev liblzma-dev

    - name: Mark workspace as a safe git directory
      shell: bash
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - uses: asdf-vm/actions/install@v4.0.1
      with:
        before_install: |
          asdf install python
          asdf reshim python

    - name: Install python dependencies
      shell: bash
      run: |
        poetry config virtualenvs.create false
        poetry install --no-interaction
