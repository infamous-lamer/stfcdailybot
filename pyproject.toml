[project]
name = "stfcdailybot"
version = "0.1.0"
description = ""
authors = [
    {name = "InfamousLamer",email = "181793914+infamous-lamer@users.noreply.github.com"}
]
requires-python = ">=3.14,<4.0"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "discord-py (>=2.7.1,<3.0.0)",
]


[tool.poetry]
packages = [
    {include = "dailies", from = "src"},
    {include = "discord_bot", from = "src"},
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "responses (>=0.26.3,<0.27.0)",
    "ruff (>=0.16.5,<0.17.0)",
    "detect-secrets (>=1.5.0,<2.0.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
    "yamllint (>=1.38.0,<2.0.0)",
    "coverage (>=7.16.0,<8.0.0)",
    "bandit (>=1.9.4,<2.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = ["dailies", "discord_bot"]
relative_files = true

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
